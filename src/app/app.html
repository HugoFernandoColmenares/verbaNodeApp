<div class="shell">
  <header class="header">
    <p class="wordmark">VerbaNode</p>
    <nav class="tasks" aria-label="Tasks">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">Commit</a>
      <a routerLink="/pr" routerLinkActive="is-active">Pull request</a>
      <a routerLink="/prompt" routerLinkActive="is-active">Prompt</a>
      <a routerLink="/git" routerLinkActive="is-active">Git</a>
      <a routerLink="/history" routerLinkActive="is-active">History</a>
    </nav>
    <p class="status-chip" [attr.data-phase]="status.phase()">{{ status.label() }}</p>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
